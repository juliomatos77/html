<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafeteria Grão Dourado — CSS 
    Interno</title>
    <style>
        p {
            color: #8B4513;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: #8B4513;
            font-family: 'Comic Sans MS', cursive;
        }
        header {
            background-color: #6b4602;
            padding: 20px;
            text-align: center;
        }
        header h1 {
          color: #FFFFFF;
            margin: 0;
        }
        header p {
            color: #FFFFFF;
        }
        body {
            background-color: #FFF8DC;
            margin: 0;
        }section {
          background-color: #ffffff;
          border-radius: 10px;
          border: 2px solid #8B4513;
          padding: 16px;
          margin-bottom: 10px;
        }
        section h3 {
            color: #8B4513;
            font-family: 'Courier New', monospace;
            font-size: 22px;
            margin-top: 0;
        }
        section p {
            color: #8B4513;
            font-family: Arial, sans-serif;
            font-size: 18px;
        }
        main {
          width: 400px;
          margin: 0 auto;
        }
        main h2 {
          color: #8B4513;
          font-family: 'Courier New', monospace;
          font-size: 26px;
          text-align: center;
        }
        footer {
          background-color: #6b4602;
          color: #FFFFFF;
          text-align: center;
          padding: 10px;
          position: fixed;
          bottom: 0;
          width: 100%;
        }
        </style>
</head>
<body>
  <header>
    <h1>☕ Cafeteria Grão Dourado</h1>
    <p>O melhor café de Suzano</p>
  </header>

  <main>
    <h2>Nosso cardápio</h2>

    <section>
      <h3>Espresso</h3>
      <p>Café curto e intenso. R$ 6,00</p>
    </section>

    <section>
      <h3>Cappuccino</h3>
      <p>Café, leite vaporizado e canela. R$ 9,50</p>
    </section>

    <section>
      <h3>Pão de queijo</h3>
      <p>Quentinho, saído do forno. R$ 5,00</p>
    </section>
  </main>

  <footer>
    Exemplo de aula — CSS Interno
  </footer>

</body>
</html>
